# Release workflow: runs when a tag matching v* is pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Runs the checks, builds the wheel and sdist, and attaches them to a GitHub release.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv no longer publishes floating major tags; Dependabot keeps this pin current.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-groups --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  build:
    name: Build distributions
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv no longer publishes floating major tags; Dependabot keeps this pin current.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      # The version is dynamic (read from src/shadowgate/__init__.py), so check the built files.
      - name: Check tag matches package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/shadowgate_llm-$version-py3-none-any.whl" ] || [ ! -f "dist/shadowgate_llm-$version.tar.gz" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the built distributions:" >&2
            ls dist >&2
            exit 1
          fi
      - name: Smoke-test the wheel
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/shadowgate" --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release with dist files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
