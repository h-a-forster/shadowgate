[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "shadowgate-llm"
dynamic = ["version"]
description = "Confidence-gated LLM cascades that measure how often the cheap tier is wrong on the cases it answers alone: shadow audits with confidence intervals, threshold sweeps, accuracy/cost Pareto curves."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "shadowgate contributors" }]
keywords = ["llm", "routing", "cascade", "model-routing", "escalation", "calibration", "evaluation", "audit", "agents", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]

[project.urls]
Homepage = "https://github.com/h-a-forster/shadowgate"
Documentation = "https://github.com/h-a-forster/shadowgate/blob/main/docs/guide.md"
Source = "https://github.com/h-a-forster/shadowgate"
Issues = "https://github.com/h-a-forster/shadowgate/issues"
Changelog = "https://github.com/h-a-forster/shadowgate/blob/main/CHANGELOG.md"

[project.scripts]
shadowgate = "shadowgate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "anthropic>=0.70"]

[tool.hatch.version]
path = "src/shadowgate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shadowgate"]

[tool.hatch.build.targets.sdist]
include = ["src/shadowgate", "tests", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls a real model provider (skipped unless SHADOWGATE_LIVE=1)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/shadowgate"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true
